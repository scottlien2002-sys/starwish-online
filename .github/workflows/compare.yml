name: Before/after screenshots

# 建置「比較基準版本」與目前分支，在相同鏡頭、相同動畫時間點截圖並排，結果推到 compare 分支。
# 不影響遊戲網站（gh-pages）。
#   修改前 vs 修改後（高畫質）：W1 草原 3 張、星露啵啵 11 張
#   修改後 高 / 中 / 低 畫質對照：同上
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "比較基準 commit（預設：第二階段開始前 = 第一階段 8e80163）"
        required: false
        default: "8e80163646b13c6d22cd7b69b9ffe5bf75a60581"
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "tests/e2e/snap-lab.mjs"
      - "tests/e2e/snap-bobo3.mjs"
      - "public/models/**"
      - "tests/e2e/compose-compare.mjs"
      - ".github/workflows/compare.yml"

permissions:
  contents: write

concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE: ${{ github.event.inputs.baseline || '8e80163646b13c6d22cd7b69b9ffe5bf75a60581' }}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: cur
      - uses: actions/checkout@v5
        with:
          path: base
          ref: ${{ env.BASELINE }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build current
        working-directory: cur
        run: npm install --no-audit --no-fund && npm run build

      - name: Build baseline
        working-directory: base
        run: npm install --no-audit --no-fund && npm run build

      - name: Install browsers
        working-directory: cur
        run: npx playwright install --with-deps webkit chromium

      - name: Snapshots
        run: |
          S=cur/tests/e2e/snap-lab.mjs
          node $S base/dist out/game_before webkit game
          node $S base/dist out/lab_before webkit lab
          for q in high medium low; do
            node $S cur/dist out/game_$q webkit game $q
            node $S cur/dist out/lab_$q webkit lab $q
          done
          C=cur/tests/e2e/compose-compare.mjs
          node $C out/compare_game "修改前=out/game_before" "修改後（高畫質）=out/game_high"
          node $C out/compare_lab "修改前=out/lab_before" "修改後（高畫質）=out/lab_high"
          node $C out/quality_game "高=out/game_high" "中=out/game_medium" "低=out/game_low"
          node $C out/quality_lab "高=out/lab_high" "中=out/lab_medium" "低=out/lab_low"
          # 星露啵啵 V3 模型預覽（只有含 ?lab=bobo3 的版本才有）
          if [ -f cur/src/lab/BoboV3Lab.ts ]; then
            for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo3_$q webkit $q || true; done
            # V3.1 美術精修（只有含 ?lab=bobo31 的版本才有；同一份程式同時截 V3 對照）
            if grep -q "bobo31" cur/src/main.ts; then
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo31_$q webkit $q bobo31 || true; done
            fi
            if grep -q "bobo32" cur/src/main.ts && ! grep -q "bobo34" cur/src/main.ts; then
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo32_$q webkit $q bobo32 || true; done
              for l in bobo31 bobo32; do CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_$l chromium high $l || true; done
            fi
            if grep -q "bobo38" cur/src/main.ts; then
              # V3.7／V3.8 對照（Chromium 高畫質；含設定圖對照模式 r_*）＋ V3.8 WebKit 三種畫質
              for l in bobo37 bobo38; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_$l chromium high $l || true; done
              for l in bobo37 bobo38; do CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_$l chromium high $l || true; done
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo38_$q webkit $q bobo38 || true; done
            elif grep -q "bobo37" cur/src/main.ts; then
              # V3.6／V3.7 對照（Chromium 高畫質；含設定圖對照模式 r_*）＋ V3.7 WebKit 三種畫質
              for l in bobo36 bobo37; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_$l chromium high $l || true; done
              for l in bobo36 bobo37; do CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_$l chromium high $l || true; done
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo37_$q webkit $q bobo37 || true; done
            elif grep -q "bobo36" cur/src/main.ts; then
              # V3.5／V3.6 對照（Chromium 高畫質，同鏡頭同光照）＋ V3.6 WebKit 三種畫質
              for l in bobo35 bobo36; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_$l chromium high $l || true; done
              for l in bobo35 bobo36; do CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_$l chromium high $l || true; done
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo36_$q webkit $q bobo36 || true; done
            elif grep -q "bobo35" cur/src/main.ts; then
              # V3.4／V3.5 對照（Chromium 高畫質，同鏡頭同光照）＋ V3.5 WebKit 三種畫質
              for l in bobo34 bobo35; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_$l chromium high $l || true; done
              for l in bobo34 bobo35; do CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_$l chromium high $l || true; done
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo35_$q webkit $q bobo35 || true; done
            elif grep -q "bobo34" cur/src/main.ts; then
              # V3.3／V3.4 對照（Chromium 高畫質，同鏡頭同光照）＋ V3.4 WebKit 三種畫質
              for l in bobo33 bobo34; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_$l chromium high $l || true; done
              for l in bobo33 bobo34; do CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_$l chromium high $l || true; done
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo34_$q webkit $q bobo34 || true; done
            elif grep -q "bobo33" cur/src/main.ts; then
              for q in high medium low; do node cur/tests/e2e/snap-bobo3.mjs cur/dist out/bobo33_$q webkit $q bobo33 || true; done
              CLOSE_ONLY=1 node cur/tests/e2e/snap-bobo3.mjs cur/dist out/close_bobo33 chromium high bobo33 || true
              # 正面、側面、背面（Chromium 高畫質，與近距離對照同一環境）
              node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_bobo33 chromium high bobo33 || true
              node cur/tests/e2e/snap-bobo3.mjs cur/dist out/chr_bobo32 chromium high bobo32 || true
            fi
          fi
          echo "{\"baseline\":\"${BASELINE}\",\"current\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\"}" > out/meta.json

      - name: Push compare branch
        # 每個功能分支的比較圖放在各自的分支，互不覆蓋：render-bobo-v2 → compare-bobo-v2
        run: |
          case "${GITHUB_REF_NAME}" in
            feature/render-bobo-v2) CB=compare-bobo-v2 ;;
            feature/render-bobo-v3) CB=compare-bobo-v3 ;;
            feature/render-bobo-v31) CB=compare-bobo-v31 ;;
            feature/render-bobo-v32) CB=compare-bobo-v32 ;;
            feature/render-bobo-v33) CB=compare-bobo-v33 ;;
            feature/render-bobo-v34) CB=compare-bobo-v34 ;;
            feature/render-bobo-v35) CB=compare-bobo-v35 ;;
            feature/render-bobo-v36) CB=compare-bobo-v36 ;;
            feature/render-bobo-v37) CB=compare-bobo-v37 ;;
            feature/render-bobo-v38) CB=compare-bobo-v38 ;;
            *) CB=compare ;;
          esac
          echo "比較圖分支：$CB"
          cd out
          git init -q -b work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Compare ${BASELINE::7} vs ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$CB"
