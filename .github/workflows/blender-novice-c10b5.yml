name: "Blender — Novice C1.0-B5 candidate (female ears + hair tuck, animation polish, merged skinned meshes)"

# Stage 5.5 第二批 C1.0-B5（候選）：女生耳朵＋耳旁髮束往後撥、動作品質、P2 蒙皮網格合併、穿模檢查。C1.0-B2／B4 檔案不改。
# 不綁骨架、不做動畫、不接進遊戲。結果推到 art-novice-c10b5 分支（一般推送、不覆蓋歷史）（不影響 B.2、遊戲網站與 main）。
# 原始設定圖不放進儲存庫。
on:
  workflow_dispatch:
  push:
    branches: ["feature/novice-c10b5-rig"]
    paths:
      - "art/novice-c10b5/**"
      - "art/novice-c10b4/**"
      - "art/novice-c10b2/**"
      - "art/novice-c10b1/**"
      - "art/novice-c10b/**"
      - "art/novice-c10a/**"
      - "art/novice-c04/**"
      - "art/novice-c03/**"
      - "art/novice-c02/**"
      - "art/novice-c01/**"
      - "art/novice-c0/**"
      - "art/novice-v2/novice_shapes.py"
      - "art/novice-v2/sdf.py"
      - ".github/workflows/blender-novice-c10b5.yml"

permissions:
  contents: write

concurrency:
  group: blender-novice-c10b5
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Sample SDF parts into meshes (numpy)
        run: |
          python3 -m pip install --quiet numpy pillow
          mkdir -p out/parts
          python3 art/novice-c10b5/export_c10b5.py out/parts both 2>&1 | tail -80
          mkdir -p out/parts_a
          python3 art/novice-c10b4/export_c10b4.py out/parts_a both 2>&1 | tail -5
          ls -la out/parts

      - name: System libraries for Blender (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0 >/dev/null

      - name: Download Blender ${{ env.BLENDER_VERSION }} (official, free)
        run: |
          URL="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 5 --retry-delay 10 "$URL" -o /tmp/blender.tar.xz || curl -fsSL --retry 5 "https://mirrors.ocf.berkeley.edu/blender/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version | head -2

      - name: Colour renders (4 views + face close-ups) and GLB (hq + lite)
        run: |
          /opt/blender/blender -b --factory-startup -noaudio -P art/novice-c10b5/blender_c10b5.py -- --parts "$PWD/out/parts" --parts-a "$PWD/out/parts_a" --out "$PWD/out" 2>&1 | tee out/blender.log | grep -v "^Fra:" | grep -v "Sample" | tail -60
          for g in male female; do for v in front side back left45; do test -f out/c10b5_${g}_${v}.png; done; test -f out/novice_c10b5_${g}_hq.glb; test -f out/novice_c10b5_${g}_lite.glb; test -f out/c10b5_${g}_ear_front.png; test -f out/c10b4_${g}_ear_front.png; test -f out/anim_${g}_Run_025_side.png; done

      - name: Validate GLB (Khronos glTF-Validator)
        run: |
          mkdir -p /tmp/gv && cd /tmp/gv && npm init -y >/dev/null && npm i --no-save gltf-validator@latest 2>&1 | tail -3
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/gv/node_modules node -e '
            const v = require("gltf-validator"); const fs = require("fs");
            (async () => {
              let bad = 0; const s = {};
              for (const g of ["male", "female"]) for (const q of ["hq","lite"]) {
                const b = fs.readFileSync(`out/novice_c10b5_${g}_${q}.glb`);
                const r = await v.validateBytes(new Uint8Array(b));
                const k = `${g}_${q}`;
                s[k] = { errors: r.issues.numErrors, warnings: r.issues.numWarnings, bytes: b.length, triangles: r.info.totalTriangleCount, materials: r.info.materialCount, textures: (r.info.resources || []).filter(x => x.storage === "buffer-view" && x.image).map(x => x.image) };
                { const j = (() => { const dv = new DataView(b.buffer, b.byteOffset); const len = dv.getUint32(12, true); return JSON.parse(Buffer.from(b.subarray(20, 20 + len)).toString()); })();
                  s[k].color0_meshes = j.meshes.filter(m => m.primitives.some(p => "COLOR_0" in p.attributes)).length;
                  s[k].meshes = j.meshes.length;
                  s[k].textured_materials = j.materials.filter(m => m.pbrMetallicRoughness && m.pbrMetallicRoughness.baseColorTexture).length;
                  s[k].skins = (j.skins || []).length; s[k].joints = ((j.skins || [])[0] || { joints: [] }).joints.length;
                  s[k].animations = (j.animations || []).map(a => a.name);
                  s[k].skinned_meshes = j.nodes.filter(n => n.mesh !== undefined && n.skin !== undefined).length; }
                const codes = {}; for (const m of r.issues.messages) { const c = `${m.severity === 0 ? "E" : m.severity === 1 ? "W" : "I"}:${m.code}`; codes[c] = codes[c] || { n: 0, sample: `${m.pointer || ""} ${m.message}` }; codes[c].n++; }
                s[k].issue_codes = codes;
                console.log(k, JSON.stringify(s[k]));
                bad += r.issues.numErrors;
              }
              fs.writeFileSync("out/validator_summary.json", JSON.stringify(s, null, 1));
              if (bad) process.exit(1);
            })();'

      - name: Contact sheet
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          rows = []
          for g in ("male", "female"):
              ims = [Image.open(f"out/c10b5_{g}_{v}.png").convert("RGB") for v in ("front", "side", "back", "left45") if os.path.exists(f"out/c10b5_{g}_{v}.png")]
              if ims:
                  rows.append(ims)
          if rows:
              w = max(sum(i.width for i in r) for r in rows); h = sum(max(i.height for i in r) for r in rows)
              sheet = Image.new("RGB", (w, h), (235, 236, 242)); y = 0
              for r in rows:
                  x = 0
                  for i in r:
                      sheet.paste(i, (x, y)); x += i.width
                  y += max(i.height for i in r)
              sheet.save("out/contact_sheet.png")
          PY

      - name: Push results to art-novice-c10b5 branch (normal push on top of the existing branch, no force)
        if: always()
        run: |
          mkdir -p out/textures && cp out/parts/c10b5_face_*.png out/textures/ && rm -rf out/parts out/parts_a
          echo "{\"commit\":\"${GITHUB_SHA}\",\"blender\":\"${BLENDER_VERSION}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > out/build.json
          cd out
          git init -q -b work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$URL" refs/heads/art-novice-c10b5 >/dev/null 2>&1; then
            git fetch -q --depth 1 "$URL" art-novice-c10b5 && git reset -q --soft FETCH_HEAD
          fi
          git add -A
          git commit -qm "Novice C1.0-B5 ${GITHUB_SHA::7}"
          git push -q "$URL" HEAD:refs/heads/art-novice-c10b5
