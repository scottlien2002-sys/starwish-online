name: Junkyard map E2E (Stage 6.8+6.9)

# 星廢垃圾場（Claude B）：只在 feature/render-map-junkyard 執行。
# 型別檢查 → 單元測試 → 建置 → 端對端測試（Chromium＋WebKit、三段畫質、iPhone 直向＋高畫質橫向）→ 截圖與報告推到 art-map-junkyard-e2e（一般 push，不 force）。
# 獨立預覽網址由既有的 CI & Deploy 部署到 /preview-map-junkyard/（瘦身部署，只替換自己的資料夾）。
# dev/junkyard-v2（後續開發）：不觸發任何部署；結果推到 art-map-junkyard-v2-e2e，不覆蓋已驗收的 art-map-junkyard-e2e。
on:
  push:
    branches: [feature/render-map-junkyard, dev/junkyard-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: junkyard-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install, typecheck, unit tests, build
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          node --test tests/unit/junkyard-map.test.ts tests/unit/lodKit.test.ts
          npm run build
          du -sh dist
      - name: Junkyard E2E (Chromium + WebKit; software rendering — FPS is NOT iPhone)
        run: |
          npx playwright install --with-deps chromium webkit >/dev/null
          node tests/e2e/run-junkyard-e2e.mjs dist chromium,webkit "$PWD/out/junkyard"
      - name: Small-prop density fade compare (jyfade=0 vs on; CI, not iPhone)
        if: always()
        run: node tests/e2e/run-junkyard-fade-compare.mjs dist chromium "$PWD/out/junkyard/fade/"
      - name: Push results to art branch (normal push, no force)
        if: always()
        env:
          ART_BRANCH: ${{ github.ref_name == 'dev/junkyard-v2' && 'art-map-junkyard-v2-e2e' || 'art-map-junkyard-e2e' }}
        run: |
          mkdir -p out/junkyard
          echo "{\"commit\":\"${GITHUB_SHA}\",\"run\":\"${GITHUB_RUN_ID}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > out/junkyard/build.json
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REPO" "$ART_BRANCH" >/dev/null 2>&1; then
            git clone -q --depth 1 --branch "$ART_BRANCH" "$REPO" /tmp/artjy
          else
            mkdir -p /tmp/artjy && cd /tmp/artjy && git init -q -b "$ART_BRANCH" && git remote add origin "$REPO" && cd -
          fi
          rsync -a --delete --exclude .git out/junkyard/ /tmp/artjy/
          cd /tmp/artjy
          git add -A
          git commit -qm "Junkyard E2E ${GITHUB_SHA::7}" || echo "no changes"
          git push -q origin "HEAD:$ART_BRANCH"
