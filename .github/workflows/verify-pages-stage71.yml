name: Verify public GitHub Pages (Stage 7.1, read-only)
# 只從公開網址讀取：不建置、不部署、不改 gh-pages。截圖推到每次執行各自的新分支 results/stage71-verify-<run id>（一般 push，不 force）。
on:
  push:
    branches: [verify/pages-stage71]
permissions:
  contents: write
concurrency:
  group: verify-pages-stage71
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify public URL
        run: |
          mkdir -p /tmp/shots
          SHOTS_DIR=/tmp/shots node tests/e2e/verify-public.mjs "https://scottlien2002-sys.github.io/starwish-online/preview-stage71-world/" "$(cat verify-target.txt)" 25
      - name: Push screenshots to results branch
        if: always()
        run: |
          cd /tmp/shots && ls -la
          git init -q && git checkout -q -b "results/stage71-verify-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Stage 7.1 public URL screenshots ${GITHUB_SHA::7}" || exit 0
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "results/stage71-verify-${GITHUB_RUN_ID}"
