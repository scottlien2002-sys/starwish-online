name: Maintenance — retire Claude B's older village previews (char65, final64)
# 使用者 2026-11-27 核准：GitHub Pages 容量政策「B 只留最新及必要驗收版本」→ 移除 preview-village-char65、preview-village-final64。
# B 保留 preview-village-npc67（最新）與 preview-village-art66。原始碼分支全部保留，需要時可重新部署。
# 一般 push，不 force；其他預覽不動。
on:
  push:
    branches: [maint/pages-prune-b-old-previews]
permissions:
  contents: write
concurrency:
  group: pages-cleanup
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          set -e
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pages
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pages
            cd /tmp/pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for D in preview-village-char65 preview-village-final64; do
              if [ -d "$D" ]; then du -sm "$D"; git rm -rq "$D"; printf '\n- %s：移除 /%s/（使用者核准：B 只留最新及必要驗收版本；保留 npc67、art66；原始碼分支保留）\n' "$(date -u +%F)" "$D" >> PRUNED_PREVIEWS.md; fi
            done
            git add PRUNED_PREVIEWS.md
            git commit -qm "Retire /preview-village-char65/ and /preview-village-final64/ (user-approved capacity policy)" || { echo nothing; exit 0; }
            du -sm --exclude=.git .
            if git push -q origin gh-pages; then echo pushed; exit 0; fi
            cd /; sleep $((attempt * 10))
          done
          exit 1
