name: CI & Deploy

# 每次推送到 main：型別檢查 → 單元測試 → 建置 → 瀏覽器測試 → 部署到 gh-pages 分支（GitHub Pages）
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Stage 5.6 play E2E (WebKit)
        id: playe2e
        continue-on-error: true
        run: node tests/e2e/run-play-e2e.mjs dist webkit

      - name: Stage 7 world loop E2E (WebKit + Chromium)
        id: worlde2e
        continue-on-error: true
        run: node tests/e2e/run-world-e2e.mjs dist webkit,chromium

      - name: Stage 6 P2-3 village E2E (Chromium + WebKit)
        id: villagee2e
        continue-on-error: true
        run: node tests/e2e/run-village-e2e.mjs dist chromium,webkit

      - name: Stage 6 map E2E (Chromium + WebKit)
        id: mape2e
        continue-on-error: true
        run: node tests/e2e/run-map-e2e.mjs dist chromium,webkit

      - name: Attach map test report (early, for the preview)
        if: startsWith(github.ref, 'refs/heads/feature/render')
        run: |
          mkdir -p dist/ci-report
          cp -r test-results/. dist/ci-report/ 2>/dev/null || true
          echo "{\"commit\":\"${GITHUB_SHA}\",\"runId\":\"${GITHUB_RUN_ID}\",\"villageE2e\":\"${{ steps.villagee2e.outcome }}\",\"playE2e\":\"${{ steps.playe2e.outcome }}\",\"worldE2e\":\"${{ steps.worlde2e.outcome }}\",\"mapE2e\":\"${{ steps.mape2e.outcome }}\",\"note\":\"preview deployed before the long legacy E2E; see the Actions log for its result\"}" > dist/ci-report/summary.json

      - name: Deploy preview (own folder only)
        # feature/render-* 分支各自部署到獨立子路徑，只替換自己的資料夾，不影響正式版與其他預覽版
        #   feature/render-upgrade → /preview/          （第一階段）
        #   feature/render-<名稱>  → /preview-<名稱>/    （例：render-bobo-v2 → /preview-bobo-v2/）
        if: startsWith(github.ref, 'refs/heads/feature/render')
        run: |
          if [ "${GITHUB_REF_NAME}" = "feature/render-upgrade" ]; then DIR=preview; else DIR="preview-${GITHUB_REF_NAME#feature/render-}"; fi
          case "$DIR" in preview|preview-[a-z0-9-]*) ;; *) echo "invalid preview dir: $DIR"; exit 1;; esac
          echo "預覽路徑：/$DIR/"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pages
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pages
            rm -rf "/tmp/pages/$DIR"
            mkdir -p "/tmp/pages/$DIR"
            cp -r dist/. "/tmp/pages/$DIR/"
            echo "{\"branch\":\"${GITHUB_REF_NAME}\",\"commit\":\"${GITHUB_SHA}\",\"path\":\"/$DIR/\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > "/tmp/pages/$DIR/preview.json"
            cd /tmp/pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -qm "Preview /$DIR/ ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
            if git push -q origin gh-pages; then echo "deployed /$DIR/"; exit 0; fi
            cd - >/dev/null
            echo "push rejected (another deploy in progress), retry $attempt"; sleep $((attempt * 5))
          done
          exit 1

      - name: HUD layout test (WebKit)
        id: hud
        continue-on-error: true
        run: node tests/harness/run-hud-layout.mjs webkit

      - name: E2E test (Chromium + WebKit)
        id: e2e
        continue-on-error: true
        run: node tests/e2e/run-e2e.mjs dist chromium,webkit

      - name: Attach test report to site
        run: |
          mkdir -p dist/ci-report
          cp -r test-results/. dist/ci-report/ 2>/dev/null || true
          cat > dist/ci-report/summary.json <<EOF
          {"commit":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","hud":"${{ steps.hud.outcome }}","e2e":"${{ steps.e2e.outcome }}","mapE2e":"${{ steps.mape2e.outcome }}","builtAt":"$(date -u +%FT%TZ)"}
          EOF
          cp package-lock.json dist/ci-report/package-lock.json

      - name: Deploy to gh-pages branch
        # 只有 main 會部署到正式網址；部署前保留所有預覽版資料夾（preview*）
        # 版面測試與端對端測試都必須通過才部署正式版（測試失敗時正式網站維持原狀）
        if: github.ref == 'refs/heads/main' && steps.hud.outcome == 'success' && steps.e2e.outcome == 'success'
        run: |
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/oldpages || true
          for d in /tmp/oldpages/preview*; do [ -d "$d" ] && cp -r "$d" dist/; done
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Fail job if browser tests failed
        if: steps.hud.outcome == 'failure' || steps.e2e.outcome == 'failure' || steps.mape2e.outcome == 'failure' || steps.playe2e.outcome == 'failure' || steps.villagee2e.outcome == 'failure' || steps.worlde2e.outcome == 'failure'
        run: |
          echo "瀏覽器測試未通過，詳見網站 ci-report/ 或上方記錄"
          exit 1
