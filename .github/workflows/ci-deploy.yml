name: CI & Deploy

# 每次推送到 main：型別檢查 → 單元測試 → 建置 → 瀏覽器測試 → 部署到 gh-pages 分支（GitHub Pages）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-deploy
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: HUD layout test (WebKit)
        id: hud
        continue-on-error: true
        run: node tests/harness/run-hud-layout.mjs webkit

      - name: E2E test (Chromium + WebKit)
        id: e2e
        continue-on-error: true
        run: node tests/e2e/run-e2e.mjs dist chromium,webkit

      - name: Attach test report to site
        run: |
          mkdir -p dist/ci-report
          cp -r test-results/. dist/ci-report/ 2>/dev/null || true
          cat > dist/ci-report/summary.json <<EOF
          {"commit":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","hud":"${{ steps.hud.outcome }}","e2e":"${{ steps.e2e.outcome }}","builtAt":"$(date -u +%FT%TZ)"}
          EOF
          cp package-lock.json dist/ci-report/package-lock.json

      - name: Deploy to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Fail job if browser tests failed
        if: steps.hud.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "瀏覽器測試未通過，詳見網站 ci-report/ 或上方記錄"
          exit 1
