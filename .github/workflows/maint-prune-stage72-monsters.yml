name: Maintenance — retire /preview-stage72-monsters/ (superseded by /preview-stage72-world/)
# GitHub Pages 容量政策（使用者核准：A、B 都只留最新及必要驗收版本）。
# Stage 7.2 第一批的內容（風羽狐接口、?lab=rigged）全部包含在 Stage 7.2 整合版 /preview-stage72-world/。
# 只移除 Claude A 自己的 preview-stage72-monsters；其他開發線的預覽不動。一般 push，不 force。
# 原始碼保留：feature/render-stage72-monsters、backup/stage72-batch1（需要時可重新部署）。
on:
  push:
    branches: [maint/pages-prune-stage72-monsters]
permissions:
  contents: write
concurrency:
  group: pages-cleanup
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          set -e
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pages
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pages
            cd /tmp/pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            D=preview-stage72-monsters
            [ -d "$D" ] || { echo "already gone"; exit 0; }
            du -sm $D
            git rm -rq "$D"
            printf '\n- %s：移除 /preview-stage72-monsters/（Stage 7.2 第一批；已併入 /preview-stage72-world/。原始碼：feature/render-stage72-monsters、backup/stage72-batch1）\n' "$(date -u +%F)" >> PRUNED_PREVIEWS.md
            git add PRUNED_PREVIEWS.md
            git commit -qm "Retire /preview-stage72-monsters/ (superseded by /preview-stage72-world/)"
            du -sm --exclude=.git .
            if git push -q origin gh-pages; then echo pushed; exit 0; fi
            cd /; sleep $((attempt * 10))
          done
          exit 1
