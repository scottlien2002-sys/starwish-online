name: Blender — Novice V2 grey models (Stage 5.4 step B)

# 步驟 B：男女初心者灰模（SDF 零件 → Surface Nets 網格）→ Blender 黏土材質四視角渲染＋灰模 GLB。
# 只做外型與比例驗證：沒有貼圖、材質、骨架、動畫，也不接進遊戲。
# 結果推到 art-novice-v2 分支（不影響遊戲網站與 main）。原始設定圖不放進儲存庫。
on:
  workflow_dispatch:
  push:
    branches: ["feature/render-novice-v2"]
    paths:
      - "art/novice-v2/**"
      - ".github/workflows/blender-novice-v2.yml"

permissions:
  contents: write

concurrency:
  group: blender-novice-v2
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Sample SDF parts into meshes (numpy)
        run: |
          python3 -m pip install --quiet numpy pillow
          mkdir -p out/parts
          python3 art/novice-v2/export_parts.py out/parts both 2>&1 | tail -80
          ls -la out/parts

      - name: System libraries for Blender (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0 >/dev/null

      - name: Download Blender ${{ env.BLENDER_VERSION }} (official, free)
        run: |
          URL="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 5 --retry-delay 10 "$URL" -o /tmp/blender.tar.xz || curl -fsSL --retry 5 "https://mirrors.ocf.berkeley.edu/blender/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version | head -2

      - name: Clay renders (front / side / back / 45°) and grey GLB
        run: |
          /opt/blender/blender -b --factory-startup -noaudio -P art/novice-v2/blender_clay.py -- --parts "$PWD/out/parts" --out "$PWD/out" 2>&1 | tee out/blender.log | grep -v "^Fra:" | grep -v "Sample" | tail -60
          for g in male female; do for v in front side back left45; do test -f out/clay_${g}_${v}.png; done; test -f out/novice_v2_${g}_grey.glb; done

      - name: Validate GLB (Khronos glTF-Validator)
        run: |
          mkdir -p /tmp/gv && cd /tmp/gv && npm init -y >/dev/null && npm i --no-save gltf-validator@latest 2>&1 | tail -3
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/gv/node_modules node -e '
            const v = require("gltf-validator"); const fs = require("fs");
            (async () => {
              let bad = 0; const s = {};
              for (const g of ["male","female"]) {
                const b = fs.readFileSync(`out/novice_v2_${g}_grey.glb`);
                const r = await v.validateBytes(new Uint8Array(b));
                s[g] = { errors: r.issues.numErrors, warnings: r.issues.numWarnings, bytes: b.length, triangles: r.info.totalTriangleCount };
                console.log(g, JSON.stringify(s[g]));
                bad += r.issues.numErrors;
              }
              fs.writeFileSync("out/validator_summary.json", JSON.stringify(s, null, 1));
              if (bad) process.exit(1);
            })();'

      - name: Contact sheet
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          rows = []
          for g in ("male", "female"):
              ims = [Image.open(f"out/clay_{g}_{v}.png").convert("RGB") for v in ("front", "side", "back", "left45") if os.path.exists(f"out/clay_{g}_{v}.png")]
              if ims:
                  rows.append(ims)
          if rows:
              w = max(sum(i.width for i in r) for r in rows); h = sum(max(i.height for i in r) for r in rows)
              sheet = Image.new("RGB", (w, h), (235, 236, 242)); y = 0
              for r in rows:
                  x = 0
                  for i in r:
                      sheet.paste(i, (x, y)); x += i.width
                  y += max(i.height for i in r)
              sheet.save("out/contact_sheet.png")
          PY

      - name: Push results to art-novice-v2 branch
        if: always()
        run: |
          rm -rf out/parts
          echo "{\"commit\":\"${GITHUB_SHA}\",\"blender\":\"${BLENDER_VERSION}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > out/build.json
          cd out
          git init -q -b work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Novice v2 grey ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:art-novice-v2
