name: Combat VFX Lab (Claude C)

# 只在 feature/combat-vfx-* 分支執行：型別檢查 → 單元測試 → 建置 → Chromium／WebKit E2E →
# 部署到 gh-pages 的 /preview-combat-vfx/（只替換自己的資料夾；發布前檢查總容量）→ 公開網址驗證 → 測試結果推到 results/ 分支。
# 不碰 main、不碰其他預覽資料夾、不取消其他工作流程。
on:
  push:
    branches: ["feature/combat-vfx-*"]

env:
  # Stage 1 保留原網址；Stage 2 起用自己的資料夾，不覆蓋 Stage 1 預覽
  PREVIEW_DIR: ${{ github.ref_name == 'feature/combat-vfx-stage1' && 'preview-combat-vfx' || github.ref_name == 'feature/combat-vfx-stage2' && 'preview-combat-vfx-s2' || 'preview-combat-vfx-s3' }}
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combat-vfx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combat-vfx:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          mkdir -p test-results/combat-vfx
          npm run typecheck 2>&1 | tee test-results/combat-vfx/typecheck.txt
          exit ${PIPESTATUS[0]}

      - name: Unit tests (combat-vfx + manifest)
        id: unit
        continue-on-error: true
        run: |
          node --test tests/unit/combat-vfx.test.ts tests/unit/stage72.test.ts 2>&1 | tee test-results/combat-vfx/unit.txt
          exit ${PIPESTATUS[0]}

      - name: Build
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee test-results/combat-vfx/build.txt
          exit ${PIPESTATUS[0]}

      - name: Install test browsers
        if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium webkit

      - name: Combat VFX E2E (Chromium + WebKit)
        id: e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          # 除錯用：commit 訊息含 [perf-only] 時只跑效能案例（Chromium）
          CVFX_CASES: ${{ contains(github.event.head_commit.message, '[perf-only]') && 'perf' || '' }}
          CVFX_PERF_MODES: ${{ contains(github.event.head_commit.message, '[perf-only]') && 'stage3,stage3vis' || '' }}
        run: node tests/e2e/run-combat-vfx-e2e.mjs dist ${{ contains(github.event.head_commit.message, '[perf-only]') && 'chromium' || 'chromium,webkit' }} 2>&1 | tee test-results/combat-vfx/e2e.txt; exit ${PIPESTATUS[0]}

      - name: Deploy preview (own folder only)
        id: deploy
        # 部署暫停：共用資產接入順序 D → C → B，由 A 統籌部署時機。.github/cvfx-deploy-hold 存在時只跑測試、不部署 gh-pages
        if: steps.build.outcome == 'success' && steps.typecheck.outcome == 'success' && hashFiles('.github/cvfx-deploy-hold') == ''
        run: |
          DIR="$PREVIEW_DIR"
          # 預覽只放這頁需要的檔案：C1.0-B5b 男女、M004～M007、動作檔（其他舊版模型不放，控制 Pages 容量）
          find dist/models -maxdepth 1 -type f -name '*.glb' ! -name 'novice_c10b5b_*' -delete
          find dist/models -mindepth 1 -maxdepth 1 -type d ! -name monsters -exec rm -rf {} +
          du -sh dist
          # 共用資產（Claude A 規格 claude/Starwish_Shared_Assets_Spec.md）：大型模型搬進 /shared-assets/（內容雜湊命名、已發布不覆寫）
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pages /tmp/keep-assets
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/pages
            BASE=$(git -C /tmp/pages rev-parse HEAD)
            BEFORE=$(du -sm --exclude=.git /tmp/pages | cut -f1)
            # 1. 其他預覽（例如 D 的 mp81／mp82）引用的、本資料夾的檔案先暫存
            node tools/shared-assets.mjs preserve-save /tmp/pages "$DIR" /tmp/keep-assets
            rm -rf "/tmp/pages/$DIR"
            mkdir -p "/tmp/pages/$DIR"
            cp -r dist/. "/tmp/pages/$DIR/"
            # 2. 放回新建置沒有、但別人還在用的檔案
            node tools/shared-assets.mjs preserve-restore /tmp/pages "$DIR" /tmp/keep-assets
            # 3. 大型資產搬進共用區（相同內容只留一份；別人還在引用的不搬），寫 asset-remap.json、更新 index.json
            node tools/shared-assets.mjs publish /tmp/pages "$DIR" | tee -a test-results/combat-vfx/shared-assets.txt
            node tools/shared-assets.mjs verify /tmp/pages || exit 1
            # 4. 容量檢查：> 1100 MB 停止；> 1000 MB 警告；> 900 MB 提醒盤點
            TOTAL=$(du -sm --exclude=.git /tmp/pages | cut -f1)
            echo "gh-pages 基準 ${BASE::8}：發布前 ${BEFORE} MB → 發布後 ${TOTAL} MB；預覽資料夾 $(du -sm "/tmp/pages/$DIR" | cut -f1) MB、共用區 $(du -sm /tmp/pages/shared-assets | cut -f1) MB" | tee -a test-results/combat-vfx/shared-assets.txt
            echo "pages_total_mb=${TOTAL}" >> "$GITHUB_OUTPUT"
            echo "pages_before_mb=${BEFORE}" >> "$GITHUB_OUTPUT"
            if [ "$TOTAL" -gt 1100 ]; then echo "::error::gh-pages 合計 ${TOTAL} MB 超過 1100 MB，取消發布"; exit 1; fi
            if [ "$TOTAL" -gt 1000 ]; then echo "::warning::gh-pages 合計 ${TOTAL} MB 超過 1000 MB：暫停非必要大型預覽部署"; fi
            if [ "$TOTAL" -gt 900 ]; then echo "::notice::gh-pages 合計 ${TOTAL} MB 超過 900 MB：請啟動容量盤點"; fi
            echo "{\"branch\":\"${GITHUB_REF_NAME}\",\"commit\":\"${GITHUB_SHA}\",\"path\":\"/$DIR/\",\"builtAt\":\"$(date -u +%FT%TZ)\",\"e2e\":\"${{ steps.e2e.outcome }}\",\"pagesBase\":\"${BASE}\",\"sharedAssets\":\"shared-assets/v1\"}" > "/tmp/pages/$DIR/preview.json"
            cd /tmp/pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A "$DIR" shared-assets
            git commit -q -m "Preview $DIR from ${GITHUB_REF_NAME}@${GITHUB_SHA::8} (shared-assets)" || { echo "no changes"; exit 0; }
            if git push -q origin gh-pages; then echo "deployed /$DIR/"; exit 0; fi
            cd - >/dev/null
            echo "push conflict, retry $attempt（重新 clone、重做全部步驟）"; sleep $((attempt * 7))
          done
          exit 1

      - name: Deploy on hold (waiting for A)
        if: hashFiles('.github/cvfx-deploy-hold') != ''
        run: echo "::notice::部署暫停中（.github/cvfx-deploy-hold）：等 D 完成共用資產接入並由 A 確認後才部署 gh-pages；本次只跑測試" | tee -a test-results/combat-vfx/deploy-hold.txt

      - name: Verify public URL (GitHub Pages)
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/${PREVIEW_DIR}"
          for i in $(seq 1 60); do
            C=$(curl -fsSL "$URL/preview.json?t=$(date +%s)" 2>/dev/null | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
            if [ "$C" = "$GITHUB_SHA" ]; then echo "public preview.json = $C (after ${i}0 s)"; break; fi
            sleep 10
          done
          [ "$C" = "$GITHUB_SHA" ] || { echo "Pages not updated yet"; exit 1; }
          node tests/e2e/verify-preview-remap.mjs "$URL" 8 | tee test-results/combat-vfx/public-http.txt; [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          CVFX_CASES=male-medium node tests/e2e/run-combat-vfx-e2e.mjs "$URL" webkit 2>&1 | tee test-results/combat-vfx/public-e2e.txt; exit ${PIPESTATUS[0]}

      - name: Push test results to results/combat-vfx-<run>
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r test-results/. /tmp/res/ 2>/dev/null || true
          cat > /tmp/res/outcome.json <<EOF
          {"commit":"${GITHUB_SHA}","run":"${GITHUB_RUN_ID}","typecheck":"${{ steps.typecheck.outcome }}","unit":"${{ steps.unit.outcome }}","build":"${{ steps.build.outcome }}","e2e":"${{ steps.e2e.outcome }}","deploy":"${{ steps.deploy.outcome }}","verify":"${{ steps.verify.outcome }}","pagesBeforeMb":"${{ steps.deploy.outputs.pages_before_mb }}","pagesTotalMb":"${{ steps.deploy.outputs.pages_total_mb }}"}
          EOF
          cd /tmp/res
          git init -q -b "results/combat-vfx-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Combat VFX test results ${GITHUB_SHA::8} run ${GITHUB_RUN_ID}"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/results/combat-vfx-${GITHUB_RUN_ID}"

      - name: Fail if checks failed
        if: steps.typecheck.outcome != 'success' || steps.unit.outcome != 'success' || steps.build.outcome != 'success' || steps.e2e.outcome != 'success'
        run: exit 1
