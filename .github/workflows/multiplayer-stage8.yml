name: Multiplayer Stage 8 (Claude D)

# 只在 Claude D 的多人連線分支執行（feature/multiplayer-**、integration/multiplayer-**）。
# - server：伺服器／網路層測試（型別、單元、整合、WSS、PostgreSQL、2D 雙人頁）
# - game：正式 3D 遊戲（單機回歸＋3D 雙人 E2E，Chromium＋WebKit）
# - Stage 8.5：不部署 Render、不新增 GitHub Pages 預覽（部署與公開網址驗證步驟已移除；8.4 的 /preview-mp84/ 不受影響）
# - 測試結果推到 results/mp85-* 分支（JSON＋截圖），方便查看
# concurrency 依分支分開，不會取消其他人的 CI；不碰 main。
on:
  push:
    branches: ["feature/multiplayer-**", "integration/multiplayer-**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multiplayer-stage8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: multiplayer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install (ws, postgres, typescript, esbuild, playwright)
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (real WebSocket server + bots)
        run: npm run test:integration
      - name: Stage 8.2 server-authoritative combat / loot / bag tests (incl. 4/8/16/40 load)
        run: |
          set -o pipefail
          mkdir -p reports
          node --test --test-reporter=tap --test-concurrency=1 tests/combat.test.ts | tee reports/combat-tap.txt
          cp test-results/combat.json reports/combat-results.json
      - name: Stage 8.5 accounts / login / session / duplicate login / rate limit
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-concurrency=1 tests/auth.test.ts | tee reports/auth-tap.txt
      - name: Stage 8.5 skill displacement sync (leap slam / dash; no wall pass-through)
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-concurrency=1 tests/displacement.test.ts | tee reports/displacement-tap.txt
          cp test-results/displacement.json reports/displacement-results.json
      - name: Stage 8.5 server authority hardening + malformed packet fuzz
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-concurrency=1 tests/authority.test.ts | tee reports/authority-tap.txt
          cp test-results/authority.json reports/authority-results.json
      - name: Stage 8.5 bag / equipment / trade atomicity
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-concurrency=1 tests/trade.test.ts | tee reports/trade-tap.txt
          cp test-results/trade.json reports/trade-results.json
      - name: Stage 8.5 load test 10/20/32/40 (server child process; CPU / memory / tick / traffic; NOT iPhone data)
        run: |
          set -o pipefail
          node tests/load-stage85.ts 20 10,20,32,40 | tee reports/load85.txt
          cp test-results/load85.json test-results/load85.md reports/
      - name: WSS test (self-signed TLS)
        run: npm run test:wss
      - name: PostgreSQL schema / atomicity / server restart persistence
        run: sudo env "PATH=$PATH" bash db/test-db.sh
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Two-player 2D test page (Chromium)
        run: npm run test:browser
      - name: Two-player 2D test page (WebKit)
        run: MP_BROWSER=webkit node tests/browser-two-players.mjs
      - name: Push results branch
        if: always()
        run: |
          mkdir -p /tmp/res/server && cp -r reports/. /tmp/res/server/ 2>/dev/null || true
          echo "{\"job\":\"server\",\"commit\":\"${GITHUB_SHA}\",\"run\":\"${GITHUB_RUN_ID}\"}" > /tmp/res/server/meta.json
          cd /tmp/res
          git init -q -b r && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "mp85 server results ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/results/mp85-server-${GITHUB_RUN_ID}"

  # C 部門共用資產交接（Claude C，2026-11-28）：preview-mp81／mp82 的 12 個 C 檔改指向 /shared-assets/v1/。
  # 只在測試機上模擬 gh-pages（不推送 gh-pages、不部署），用 8.1／8.2 當時的程式與 E2E 做回歸：
  #   migrated＝新對照、模擬站完全沒有 preview-combat-vfx；original＝目前線上的對照（對照組）
  pages-c-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch gh-pages (read only) and the deployed mp81 / mp82 commits
        run: |
          git fetch -q --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          git fetch -q --depth=1 origin 172ab048154b715abc11542717b712ae2cf5b535 235e93cc562b917cf55dc4b95b954597152a5d87
          git rev-parse origin/gh-pages | tee /tmp/ghpages.sha
      - name: Verify 12 files (size, SHA-1, glTF header) and build new asset-remap.json
        run: node tools/mp-pages-c-migration.mjs verify origin/gh-pages /tmp/mig
      - name: Stage simulated gh-pages (migrated without preview-combat-vfx / original)
        run: |
          node tools/mp-pages-c-migration.mjs stage origin/gh-pages /tmp/pages-m migrated /tmp/mig
          node tools/mp-pages-c-migration.mjs stage origin/gh-pages /tmp/pages-o original /tmp/mig
          test ! -e /tmp/pages-m/preview-combat-vfx
      - name: Prepare Stage 8.1 / 8.2 worktrees (deployed code, unchanged)
        run: |
          git worktree add -q /tmp/w81 172ab048154b715abc11542717b712ae2cf5b535
          git worktree add -q /tmp/w82 235e93cc562b917cf55dc4b95b954597152a5d87
          for w in /tmp/w81 /tmp/w82; do (cd $w && npm install --no-audit --no-fund >/dev/null && cd multiplayer && npm install --omit=dev --no-audit --no-fund >/dev/null); done
          (cd /tmp/w82 && npx playwright install --with-deps chromium webkit)
      - name: Regression E2E on simulated Pages
        id: e2e
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/res/pages
          fails=0
          run() { # preview worktree root mode browser port
            local p=$1 w=$2 root=$3 mode=$4 b=$5 port=$6
            node tests/e2e/pages-log-server.mjs $root $port /tmp/res/pages/log-$p-$mode-$b.json & local sp=$!
            sleep 1
            (cd $w && MP_E2E_TAG="$mode-" MP_E2E_SITE="http://127.0.0.1:$port/$p" timeout 1800 node tests/e2e/run-mp-e2e.mjs dist $b) > /tmp/res/pages/e2e-$p-$mode-$b.txt 2>&1
            local rc=$?
            kill -TERM $sp; wait $sp 2>/dev/null
            cp $w/test-results/mp-e2e/$mode-mp-e2e-$b.json /tmp/res/pages/e2e-$p-$mode-$b.json 2>/dev/null
            echo "$p $mode $b exit=$rc $(grep -c '^PASS' /tmp/res/pages/e2e-$p-$mode-$b.txt) PASS / $(grep -c '^FAIL' /tmp/res/pages/e2e-$p-$mode-$b.txt) FAIL" | tee -a /tmp/res/pages/summary.txt
            if [ "$mode" = migrated ]; then
              node tools/mp-pages-c-migration.mjs audit $root /tmp/res/pages/log-$p-$mode-$b.json $p /tmp/res/pages/audit-$b | tee -a /tmp/res/pages/summary.txt
              [ ${PIPESTATUS[0]} -ne 0 ] && fails=$((fails+1))
            fi
            [ $rc -ne 0 ] && [ "$mode" = migrated ] && fails=$((fails+1))
          }
          run preview-mp81 /tmp/w81 /tmp/pages-m migrated chromium 4181
          run preview-mp81 /tmp/w81 /tmp/pages-m migrated webkit 4182
          run preview-mp81 /tmp/w81 /tmp/pages-o original chromium 4183
          run preview-mp82 /tmp/w82 /tmp/pages-m migrated chromium 4281
          run preview-mp82 /tmp/w82 /tmp/pages-m migrated webkit 4282
          run preview-mp82 /tmp/w82 /tmp/pages-o original chromium 4283
          echo "fails=$fails" | tee -a /tmp/res/pages/summary.txt
          exit $fails
      - name: Push results branch
        if: always()
        run: |
          mkdir -p /tmp/res/pages
          cp -r /tmp/mig /tmp/res/pages/migration 2>/dev/null || true
          cp /tmp/w81/test-results/mp-e2e/*.png /tmp/w82/test-results/mp-e2e/*.png /tmp/res/pages/ 2>/dev/null || true
          echo "{\"job\":\"pages-c-migration\",\"commit\":\"${GITHUB_SHA}\",\"run\":\"${GITHUB_RUN_ID}\",\"ghPages\":\"$(cat /tmp/ghpages.sha)\",\"e2e\":\"${{ steps.e2e.outcome }}\"}" > /tmp/res/pages/meta.json
          cd /tmp/res
          git init -q -b r && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "mp85 pages c-migration results ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/results/mp85-pages-${GITHUB_RUN_ID}"
      - name: Fail if tests failed
        if: steps.e2e.outcome != 'success'
        run: exit 1

  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install game + server dependencies
        run: |
          npm install --no-audit --no-fund
          (cd multiplayer && npm install --omit=dev --no-audit --no-fund)
      - name: Typecheck (game, includes multiplayer client)
        run: npm run typecheck
      - name: Unit tests (game)
        run: npm test
      - name: Build
        env:
          VITE_MP_SERVER: ${{ vars.MP_SERVER_URL }}
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: 3D two-player E2E (Chromium)
        id: mpchromium
        continue-on-error: true
        env:
          MP_E2E_VIDEO: "1"
        run: node tests/e2e/run-mp-e2e.mjs dist chromium
      - name: Co-op demo video (A desktop + B iPhone side by side)
        if: always()
        continue-on-error: true
        run: bash tools/mp-video-compose.sh test-results/mp-e2e/video test-results/mp-e2e/coop_demo.mp4 test-results/mp-e2e/mp-e2e-chromium.json
      - name: 3D two-player E2E (WebKit / Safari engine)
        id: mpwebkit
        continue-on-error: true
        run: node tests/e2e/run-mp-e2e.mjs dist webkit
      - name: Shared asset plan + migration test (/shared-assets/v1 simulated, Chromium)
        id: migrate
        continue-on-error: true
        run: |
          node tools/mp-shared-assets.mjs plan dist test-results/shared-assets-plan.json
          node tools/mp-shared-assets.mjs stage dist /tmp/mig-root v1
          MP_E2E_ROOT=/tmp/mig-root MP_E2E_PATH=preview-mp84 MP_E2E_TAG=mig_ node tests/e2e/run-mp-e2e.mjs dist chromium
      - name: Single-player regression (Stage 7.1 world E2E, Chromium + WebKit)
        id: world
        continue-on-error: true
        run: node tests/e2e/run-world-e2e.mjs dist chromium,webkit
      - name: Client render benchmark (2/4/8/16/32/40 players; merged remote vs Lite; software rendering, relative only)
        id: render
        continue-on-error: true
        run: node tests/e2e/run-mp-render-perf.mjs dist chromium 2,4,8,16,32,40
      - name: Push results branch
        if: always()
        run: |
          mkdir -p /tmp/res/game
          cp -r test-results/mp-e2e /tmp/res/game/ 2>/dev/null || true
          rm -rf /tmp/res/game/mp-e2e/video   # 原始錄影太大：只保留合成後的 mp4
          cp test-results/shared-assets-plan.json /tmp/res/game/ 2>/dev/null || true
          cp -r test-results/mp-render /tmp/res/game/ 2>/dev/null || true
          (cd test-results 2>/dev/null && find . -maxdepth 3 -name '*.json' -not -path './mp-*' -exec cp --parents {} /tmp/res/game/ \;) || true
          echo "{\"job\":\"game\",\"commit\":\"${GITHUB_SHA}\",\"run\":\"${GITHUB_RUN_ID}\",\"mpChromium\":\"${{ steps.mpchromium.outcome }}\",\"mpWebkit\":\"${{ steps.mpwebkit.outcome }}\",\"world\":\"${{ steps.world.outcome }}\",\"migrate\":\"${{ steps.migrate.outcome }}\",\"render\":\"${{ steps.render.outcome }}\"}" > /tmp/res/game/meta.json
          cd /tmp/res
          git init -q -b r && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "mp85 game results ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/results/mp85-game-${GITHUB_RUN_ID}"
      - name: Fail if tests failed
        if: steps.mpchromium.outcome != 'success' || steps.mpwebkit.outcome != 'success' || steps.world.outcome != 'success' || steps.migrate.outcome != 'success'
        run: exit 1
