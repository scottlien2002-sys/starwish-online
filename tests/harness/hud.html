<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>HUD harness</title>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud-root"></div>
    <script type="module">
      import { Hud } from "/.harness/ui/Hud.js";
      import { InputState } from "/.harness/input/InputState.js";
      import { VirtualJoystick } from "/.harness/input/VirtualJoystick.js";
      import { checkHud } from "/.harness/ui/layout-check.js";

      const hud = new Hud(document.getElementById("hud-root"));
      hud.setBars({ hp: 100, maxHp: 100, mp: 50, maxMp: 50, exp: 0, expToNext: 100 });
      hud.setFps(60);
      const input = new InputState();
      const joystick = new VirtualJoystick(hud.joystickZone, input, 56, 0.12);
      const pressed = [];
      hud.events.on("skillPressed", (e) => pressed.push(e.slot));
      window.__harness = {
        ready: true,
        issues: (insets) => checkHud(document, insets),
        move: () => input.getMove(),
        joystickActive: () => joystick.active,
        pressed,
      };
    </script>
  </body>
</html>
