<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="星願物語" />
    <meta name="theme-color" content="#9fd8ff" />
    <title>星願物語 Starwish Online</title>
    <script>
      // 啟動看門狗：若遊戲程式下載失敗、啟動出錯或超過 25 秒沒有完成，顯示原因與「重新載入」按鈕，
      // 不再停在「載入中…」。重新載入會加上時間參數，避開舊的快取。
      (function () {
        var done = false;
        window.__starwishBooted = function () {
          done = true;
        };
        function show(msg) {
          if (done) return;
          done = true;
          var s = document.getElementById("boot-status");
          if (!s) return;
          s.textContent = msg + "（" + (s.getAttribute("data-step") || "載入中") + "）";
          s.classList.add("error");
          var b = document.createElement("button");
          b.className = "boot-reload";
          b.textContent = "重新載入";
          b.onclick = function () {
            var u = new URL(location.href);
            u.searchParams.set("v", String(Date.now()));
            location.replace(u.toString());
          };
          s.appendChild(document.createElement("br"));
          s.appendChild(b);
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") show("遊戲程式下載失敗，可能是舊的快取");
            else if (t && t.tagName === "LINK") show("樣式檔下載失敗，可能是舊的快取");
            else if (e.message) show("啟動錯誤：" + e.message);
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("啟動錯誤：" + (r && r.message ? r.message : String(r)));
        });
        setTimeout(function () {
          show("載入超過 25 秒仍未完成");
        }, 25000);
      })();
    </script>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="星願物語 3D 遊戲畫面"></canvas>
    <div id="hud-root"></div>
    <div id="boot-screen">
      <div class="boot-title">星願物語</div>
      <div class="boot-sub">Starwish Online · W1 測試版</div>
      <div class="boot-status" id="boot-status">載入中…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
